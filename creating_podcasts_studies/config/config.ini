# Configuration file for Podcast Generator

[podcast]
# Language for TTS
language = pt

# Speech speed
speed = 150

# Output directory for audio files
output_dir = podcast_audios

# Input script file
script_file = data/podcast_script.md

[server]
# Server port
port = 8000

# Host address
host = 127.0.0.1

# Auto-open browser
auto_open = true

[paths]
# Web directory
web_dir = web

# Data directory
data_dir = data

# Logs directory
logs_dir = logs

# Docs directory
docs_dir = docs
