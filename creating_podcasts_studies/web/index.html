<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Player - Databricks & Engenharia de Dados</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .chapters-container {
            padding: 40px;
        }

        .chapter {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .chapter:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateX(5px);
        }

        .chapter-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .chapter-number {
            background: #667eea;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .chapter-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .chapter-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        audio {
            flex: 1;
            min-width: 200px;
            height: 40px;
            cursor: pointer;
        }

        audio::-webkit-media-controls-panel {
            background: #f0f0f0;
        }

        .chapter-duration {
            font-size: 0.9em;
            color: #666;
            padding: 5px 10px;
            background: white;
            border-radius: 4px;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #ddd;
        }

        .progress-text {
            font-size: 0.85em;
            color: #999;
            margin-top: 8px;
        }

        .download-link {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9em;
            transition: background 0.3s ease;
        }

        .download-link:hover {
            background: #667eea;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .chapters-container {
                padding: 20px;
            }

            .chapter {
                padding: 15px;
            }

            audio {
                min-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ Podcast: Databricks & Engenharia de Dados</h1>
            <p>Aprenda sobre Databricks e Engenharia de Dados de forma prática e didática</p>
        </header>

        <div class="chapters-container" id="chapters">
            <!-- Os capítulos serão inseridos aqui dinamicamente -->
        </div>

        <div class="footer">
            <p>Todos os capítulos estão disponíveis para audição. Aproveite o aprendizado!</p>
        </div>
    </div>

    <script>
        const chapters = [
            {
                number: 1,
                title: "Introdução ao Databricks e Engenharia de Dados",
                file: "../output/podcast_audios/chapter_01.mp3"
            },
            {
                number: 2,
                title: "O que é Databricks",
                file: "../output/podcast_audios/chapter_02.mp3"
            },
            {
                number: 3,
                title: "O que é Databricks (Continuação)",
                file: "../output/podcast_audios/chapter_03.mp3"
            },
            {
                number: 4,
                title: "Engenharia de Dados",
                file: "../output/podcast_audios/chapter_04.mp3"
            },
            {
                number: 5,
                title: "Conceitos Principais: ETL, Data Lake e Data Warehouse",
                file: "../output/podcast_audios/chapter_05.mp3"
            },
            {
                number: 6,
                title: "Dicas para a Certificação",
                file: "../output/podcast_audios/chapter_06.mp3"
            }
        ];

        const chaptersContainer = document.getElementById('chapters');

        chapters.forEach(chapter => {
            const chapterDiv = document.createElement('div');
            chapterDiv.className = 'chapter';
            
            chapterDiv.innerHTML = `
                <div class="chapter-header">
                    <div class="chapter-number">${chapter.number}</div>
                    <div class="chapter-title">${chapter.title}</div>
                </div>
                <div class="chapter-controls">
                    <audio controls>
                        <source src="${chapter.file}" type="audio/wav">
                        Seu navegador não suporta o elemento de áudio.
                    </audio>
                    <a href="${chapter.file}" download class="download-link">⬇️ Download</a>
                </div>
                <div class="progress-text">Clique em play para ouvir o capítulo</div>
            `;
            
            chaptersContainer.appendChild(chapterDiv);
        });
    </script>
</body>
</html>
